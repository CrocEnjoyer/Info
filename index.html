<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Dashboard</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header>

        <a href="index.html" class="logo">
            <span class="logo-leaf">❀</span>
            <span>My Dashboard</span>
        </a>

        <nav>
            <a class="active" href="index.html">Dashboard</a>
            <a href="spotify.html">Spotify</a>
            <a href="payments.html">Payments</a>
        </nav>

    </header>


    <main>

        <!-- WELCOME -->
        <section class="welcome">

            <p class="welcome-small">MY PERSONAL SPACE</p>

            <h1>Welcome back <span>♡</span></h1>

            <p id="current-date"></p>

        </section>


        <!-- DASHBOARD -->
        <div class="dashboard-grid">


            <!-- CALENDAR -->
            <section class="card calendar-card">

                <div class="section-heading">

                    <div>
                        <p class="section-label">PLANNER</p>
                        <h2>Calendar</h2>
                    </div>

                    <span class="decoration">❀</span>

                </div>


                <div class="calendar-header">

                    <button
                        id="previous-month"
                        class="month-button"
                        aria-label="Previous month">
                        ‹
                    </button>

                    <h3 id="month-year"></h3>

                    <button
                        id="next-month"
                        class="month-button"
                        aria-label="Next month">
                        ›
                    </button>

                </div>


                <div class="calendar-weekdays">

                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                    <span>Sun</span>

                </div>


                <div
                    id="calendar-days"
                    class="calendar-days">
                </div>

            </section>


            <!-- TO DO -->
            <section class="card todo-card">

                <div class="section-heading">

                    <div>
                        <p class="section-label">TODAY</p>
                        <h2>To-Do List</h2>
                    </div>

                    <span class="decoration">♡</span>

                </div>


                <div class="task-summary">

                    <span id="task-count">
                        0 tasks remaining
                    </span>

                </div>


                <div class="todo-input">

                    <input
                        type="text"
                        id="todo-input"
                        placeholder="What needs done?"
                        maxlength="100"
                    >

                    <button id="add-task">
                        +
                    </button>

                </div>


                <ul id="todo-list"></ul>


                <div id="empty-tasks" class="empty-state">

                    <span>❀</span>

                    <p>Nothing to do yet.</p>

                    <small>Enjoy the quiet!</small>

                </div>

            </section>

        </div>

    </main>


    <!-- ADD EVENT MODAL -->
    <div id="event-modal" class="modal">

        <div class="modal-content">

            <button
                id="close-modal"
                class="close-modal"
                aria-label="Close">
                ×
            </button>


            <div class="modal-flower">
                ❀
            </div>


            <p class="section-label">
                CALENDAR
            </p>

            <h2>Add an Event</h2>

            <p id="selected-date"></p>


            <label for="event-name">
                What are you doing?
            </label>

            <input
                type="text"
                id="event-name"
                placeholder="e.g. Lunch with friends"
                maxlength="100"
            >


            <button
                id="save-event"
                class="save-event">
                Add to Calendar
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
